server {
    listen 80;
    real_ip_header proxy_protocol;

    # React Router uses /app; Vite's production assets remain under /static/frontend.
    location = / {
        return 302 /app/;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        root /var/www/static;
        try_files /frontend/index.html =404;
        default_type text/html;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex off;
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    location /auth {
        internal;
        proxy_pass http://lab-server:8000/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # Every other route, including /api/, /admin/, accounts and legacy URLs,
    # keeps Django's own routing and 404 behavior.
    location / {
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/labsmanager-proxy.inc;
    }
}

