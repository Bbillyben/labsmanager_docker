# Trusted entry for an HTTPS-terminating proxy on the host or Docker network.
# Port 82 is published to loopback only; never route plain public HTTP here.
server {
    listen 82;
    real_ip_header proxy_protocol;

    location = / {
        return 302 /app/;
    }

    location = /app {
        return 301 /app/;
    }

    location ^~ /app/ {
        root /var/www/static;
        try_files /frontend/index.html =404;
        default_type text/html;
    }

    location /static/ {
        alias /var/www/static/;
        autoindex on;
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    location /auth {
        internal;
        proxy_pass http://lab-server:8000/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/labsmanager-proxy.inc;
    }
}

# HTTPS-terminating proxies can retain the legacy fallback on a separate route.
server {
    listen 83;
    real_ip_header proxy_protocol;

    location /static/ {
        alias /var/www/static/;
        autoindex on;
        expires 30d;
        add_header Pragma public;
        add_header Cache-Control "public";
    }

    location /auth {
        internal;
        proxy_pass http://lab-server:8000/auth/;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    location / {
        proxy_set_header X-Forwarded-Proto https;
        include /etc/nginx/labsmanager-proxy.inc;
    }
}
