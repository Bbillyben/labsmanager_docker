<!--
title : the title of filter
slug : the slug for parameter
options : a list of pair id:name
-->
{% load i18n %}
{% load mptt_tags %} 
<div class="col-auto" >
    <div class="d-flex flex-wrap ">
    
        <div class="card mr-2" >
            <div class="row-header">                                  
                <div class="d-flex flex-wrap subheading" role="button" data-bs-toggle="collapse" data-bs-target="#{{slug}}_filters">
                    <h4><i class="fas fa-filter"></i> {{title}}</h4> 
                </div>
            
            </div>
            <div class="row">
                <div id="{{slug}}_filters" class="collapse">
                    <div  class="in-card d-flex flex-wrap collapse calendar-filter" data-filter-id="{{slug}}" style="margin-left:1em;">
                        <div class="col-auto" >
                            <ul class="list-group">
                                <li class="">
                                    <div class="form-check form-check-inline">
                                        <input id="{{slug}}-proj" type="checkbox" class="form-check-input " name="project" value="project" checked>
                                        <label class="form-check-label" for="{{slug}}-proj">{% trans 'Project' %}</label>
                                    </div>
                                </li>
                                <li class="">
                                    <div class="form-check form-check-inline">
                                        <input id="{{slug}}-fund" type="checkbox" class="form-check-input " name="fund" value="fund" checked>
                                        <label class="form-check-label" for="{{slug}}-fund">{% trans 'Fund' %}</label>
                                    </div>
                                </li>
                                <li class="">
                                    <div class="form-check form-check-inline">
                                        <input id="{{slug}}-participant" type="checkbox" class="form-check-input " name="participant" value="participant" checked>
                                        <label class="form-check-label" for="{{slug}}-participant">{% trans 'Participant' %}</label>
                                    </div>
                                </li>
                                <li class="">
                                    <div class="form-check form-check-inline">
                                        <input id="{{slug}}-milestone" type="checkbox" class="form-check-input " name="milestone" value="milestone" checked>
                                        <label class="form-check-label" for="{{slug}}-milestone">{% trans 'Milestone' %}</label>
                                    </div>
                                </li>
                            </ul>
                        </div>
                        
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
