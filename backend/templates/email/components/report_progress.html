{% load i18n customs_tags %}
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;margin-bottom:3px;font-size:11px;line-height:15px;">
  <tr><td width="54%" style="color:#69788a;">{% trans label %}</td><td align="right">{% quotityFormat ratio %}</td></tr>
  {% if width != None %}<tr><td colspan="2" style="padding:2px 0 3px;">
    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%;height:5px;background:#edf1f5;"><tr>{% if width %}<td width="{{ width|floatformat:0 }}%" style="height:5px;background:{% if tone == 'financial' %}#456583{% else %}#779d9b{% endif %};font-size:1px;line-height:1px;">&nbsp;</td>{% endif %}{% if width < 100 %}<td style="height:5px;font-size:1px;line-height:1px;">&nbsp;</td>{% endif %}</tr></table>
  </td></tr>{% endif %}
</table>
