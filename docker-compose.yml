services:
    lab-db:
        container_name: lab-db
        image: postgres:13
        ports:
            - ${LAB_DB_PORT:-5432}:5432/tcp
        environment:
            - PGDATA=/var/lib/postgresql/data/pgdb
            - POSTGRES_USER=${LAB_DB_USER:?You must provide the 'LAB_DB_USER' variable in the .env file}
            - POSTGRES_PASSWORD=${LAB_DB_PASSWORD:?You must provide the 'LAB_DB_PASSWORD' variable in the .env file}
            - POSTGRES_DB=${LAB_DB_NAME:?You must provide the 'LAB_DB_NAME' variable in the .env file}
        volumes:
            # Map 'data' volume such that postgres database is stored externally
            - lab_data:/var/lib/postgresql/data/
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
            interval: 10s
            timeout: 3s
            retries: 10
        restart: unless-stopped

    # lab web server service
    # Uses gunicorn as the web server
    lab-server:
        build:
            context: .
            args:
                LABSMANAGER_GIT_TAG: ${LABSMANAGER_GIT_TAG:-}
        container_name: lab-server
        # If you wish to specify a particular lab version, do so here
        image: labsmanager/labsmanager:${LAB_TAG:-latest}
        ports:
            # Host-only access for local diagnostics; public traffic goes through nginx.
            - 127.0.0.1:8000:8000
        depends_on:
            lab-db:
                condition: service_healthy
        env_file:
            - .env
        volumes:
            # Data volume must map to /home/lab/data
            - lab_data:/home/labsmanager/data/
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "python3", "-c", "import http.client; c=http.client.HTTPConnection('127.0.0.1',8000,timeout=3); c.request('GET','/api/v1/me/'); s=c.getresponse().status; c.close(); raise SystemExit(0 if s in (200,301,302,400,401,403) else 1)"]
            interval: 10s
            timeout: 3s
            retries: 10
            start_period: 60s
    # worker to process sceduled tasks
    lab-worker:
        container_name: lab-worker
        # If you wish to specify a particular lab version, do so here
        image: labsmanager/labsmanager:${LAB_TAG:-latest}
        command: invoke worker
        depends_on:
            lab-server:
                condition: service_healthy
        env_file:
            - .env
        environment:
            LAB_SKIP_COLLECTSTATIC: "1"
        volumes:
            # Data volume must map to /home/lab/data
            - lab_data:/home/labsmanager/data/
        restart: unless-stopped
    lab-proxy:
        container_name: lab-proxy
        image: nginx:stable
        depends_on:
            lab-server:
                condition: service_healthy
        env_file:
            - .env
        ports:
            # Default web port is 1337 (can be changed in the .env file)
            - ${LAB_WEB_PORT:-1337}:80
            # Temporary direct access to the Django legacy interface
            - ${LAB_LEGACY_WEB_PORT:-1338}:81
            # Only a trusted HTTPS-terminating proxy may use this loopback entry.
            - 127.0.0.1:${LAB_TRUSTED_HTTPS_PORT:-1339}:82
            - 127.0.0.1:${LAB_TRUSTED_LEGACY_HTTPS_PORT:-1340}:83
        volumes:
            # Provide nginx configuration file to the container
            # Refer to the provided example file as a starting point
            - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
            - ./nginx.proxy.inc:/etc/nginx/labsmanager-proxy.inc:ro
            # nginx proxy needs access to static and media files
            - lab_data:/var/www
        restart: unless-stopped

volumes:
    # Persistent data, stored external to the container(s)
    lab_data:
        driver: local
        driver_opts:
            type: none
            o: bind
            # This directory specified where lab data are stored "outside" the docker containers
            device: ${LAB_EXT_VOLUME:?You must specify the 'LAB_EXT_VOLUME' variable in the .env file!}
